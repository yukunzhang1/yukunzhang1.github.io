  loading="eager"></iframe>
<script>
(function () {
  'use strict';
  const frame = document.getElementById('economics-series-frame');
  let observer;
  function fitSeries() {
    if (observer) observer.disconnect();
    try {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;
      function resize() {
        const height = Math.ceil(doc.body.getBoundingClientRect().height);
        if (height > 0) frame.style.height = height + 'px';
      }
      resize();
      observer = new ResizeObserver(resize);
      observer.observe(doc.body);
      // Open manuscripts outside the frame; keep in-page navigation embedded.
      doc.querySelectorAll('a[href]').forEach(function (link) {
        const url = new URL(link.href);
        if (url.origin === location.origin && url.pathname === new URL(frame.src).pathname) return;
        link.target = url.origin === location.origin ? '_top' : '_blank';
        if (link.target === '_blank') link.rel = 'noopener noreferrer';
      });
    } catch (_) {
      // Keep a usable scrolling frame if the series ever moves to another origin.
      frame.style.height = '1000px';
    }
  }
  frame.addEventListener('load', fitSeries);
  fitSeries();
})();
</script>
